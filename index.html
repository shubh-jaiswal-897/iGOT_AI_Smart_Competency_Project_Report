<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGOT AI Smart Competency Project Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background glow effects */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-1);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        header {
            z-index: 10;
            text-align: center;
            margin-bottom: 3rem;
            padding: 0 1rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            z-index: 10;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 320px;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg);
            transition: all 0.7s;
        }

        .card:hover::before {
            left: 200%;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-container {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 28px;
            transition: transform 0.3s ease;
        }
        
        .card:hover .icon-container {
            transform: scale(1.1) rotate(5deg);
        }

        .card-1 .icon-container {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            box-shadow: 0 0 20px rgba(59,130,246,0.2);
        }

        .card-2 .icon-container {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.05));
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c084fc;
            box-shadow: 0 0 20px rgba(139,92,246,0.2);
        }

        .card h2 {
            margin: 0 0 0.75rem 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .card p {
            margin: 0 0 2rem 0;
            color: var(--text-secondary);
            line-height: 1.6;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: auto;
        }

        .card-1 .card-footer {
            color: #60a5fa;
        }

        .card-2 .card-footer {
            color: #c084fc;
        }

        .card-footer svg {
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-footer svg {
            transform: translateX(6px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            .card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <header>
        <h1>Project Reports</h1>
        <p class="subtitle">iGOT AI Smart Competency Project Documentation</p>
    </header>

    <div class="container">
        <!-- Project 1 Card -->
        <a href="1.pdf" target="_blank" class="card card-1">
            <div class="icon-container">
                📄
            </div>
            <h2>Report 1</h2>
            <p>View the first comprehensive project report document in PDF format.</p>
            <div class="card-footer">
                Open Document
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </a>

        <!-- Project 2 Card -->
        <a href="2.pdf" target="_blank" class="card card-2">
            <div class="icon-container">
                📊
            </div>
            <h2>Report 2</h2>
            <p>Explore the second detailed project report document and analysis.</p>
            <div class="card-footer">
                Open Document
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </a>
    </div>
</body>
</html>
