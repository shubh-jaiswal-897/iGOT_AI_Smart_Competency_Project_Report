<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
            margin: 0;
        }

        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            max-width: 900px;
            width: 100%;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 2rem;
            width: 300px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 5px solid transparent;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .card-1 {
            border-bottom-color: #ff9a9e;
        }

        .card-1:hover {
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.3);
        }

        .card-2 {
            border-bottom-color: #a1c4fd;
        }

        .card-2:hover {
            box-shadow: 0 15px 35px rgba(161, 196, 253, 0.3);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .card:hover .icon {
            transform: scale(1.1);
        }

        h2 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
            color: #222;
        }

        p {
            margin: 0 0 1.5rem 0;
            color: #666;
            line-height: 1.5;
            flex-grow: 1;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            color: #fff;
            background: #333;
            transition: background 0.3s ease;
        }

        .card-1 .btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #d8414a;
        }

        .card-2 .btn {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #2b61b8;
        }

        .card-1:hover .btn {
            background: #ff9a9e;
            color: white;
        }

        .card-2:hover .btn {
            background: #a1c4fd;
            color: white;
        }

        @media (max-width: 650px) {
            h1 {
                font-size: 2.5rem;
            }

            .card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Project Reports</h1>
    </header>

    <div class="container">
        <!-- Project 1 Card -->
        <a href="1.pdf" target="_blank" class="card card-1">
            <h2>SIH26101</h2>

            <div class="btn">View Report</div>
        </a>

        <!-- Project 2 Card -->
        <a href="2.pdf" target="_blank" class="card card-2">
            <h2>SIH26017</h2>

            <div class="btn">View Report</div>
        </a>
    </div>

</body>

</html>
